version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/fleetcore?schema=public
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml:8000
    depends_on:
      - postgres
      - redis
      - ml

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      - ML_PORT=8000
      - ML_ENV=development

  postgres:
    image: postgres:15-alpine
    container_name: fleetcore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fleetcore
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: fleetcore-redis
    ports:
      - '6379:6379'

volumes:
  postgres_data:
